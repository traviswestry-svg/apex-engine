name: APEX Stage 3B.3.15 - Historical Gamma Receipt Synthetic Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/apex_stage3b315_gamma_receipt_provenance_correlation.py'
      - 'tests/test_apex_stage3b315_gamma_receipt_provenance_correlation.py'
      - '.github/workflows/apex-stage3b315-gamma-receipt-tests.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    name: Read-only correlation fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic fixtures (no production input)
        run: python -m unittest discover -s tests -p 'test_apex_stage3b315_gamma_receipt_provenance_correlation.py' -v
