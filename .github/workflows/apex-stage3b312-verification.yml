name: APEX Stage 3B.3.12 - Evidence Verifier Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/apex_stage3b312_linkage_runtime_verification.py'
      - 'tests/test_apex_stage3b312_linkage_runtime_verification.py'
      - '.github/workflows/apex-stage3b312-verification.yml'
permissions:
  contents: read
jobs:
  verify-reconciler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests - synthetic inputs, no production data
        run: python -m unittest discover -s tests -p 'test_apex_stage3b312_linkage_runtime_verification.py' -v
