name: APEX Stage 3B.3.15.1 - Schema Compatibility Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/apex_stage3b315_gamma_receipt_provenance_correlation.py'
      - 'tests/test_apex_stage3b315_gamma_receipt_provenance_correlation.py'
      - '.github/workflows/apex-stage3b3151-schema-compatibility-tests.yml'
permissions:
  contents: read
jobs:
  synthetic-schema-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic tests (no databases or production credentials)
        run: python -m unittest discover -s tests -p 'test_apex_stage3b315_gamma_receipt_provenance_correlation.py' -v
