<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX Report Archive</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>
body{margin:0;background:#07111f;color:#e8eef7;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#8fb4ff}.card{background:#0d1b2d;border:1px solid #20334d;border-radius:15px;padding:18px;margin-top:14px}.muted{color:#8fa2bb}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;background:#091728;border:1px solid #20334d;border-radius:10px;padding:12px}.date{font-weight:800}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:4px 8px;border:1px solid #29415e;border-radius:999px;color:#b9c7d8}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{background:#13243b;color:#cbd8ea;border:1px solid #29415e;padding:7px 9px;border-radius:8px;cursor:pointer}.viewer{line-height:1.55;overflow:auto}.viewer table{display:block;overflow-x:auto;border-collapse:collapse}.viewer td,.viewer th{padding:7px;border-bottom:1px solid #20334d;text-align:left}pre{white-space:pre-wrap}@media(max-width:700px){.wrap{padding:12px}.row{grid-template-columns:1fr}.actions button{flex:1}}
</style></head><body><div class="wrap"><div class="top"><div><div class="muted">APEX {{ version }}</div><h1>Report Archive</h1><div class="muted">Immutable Morning Briefs, Morning Readiness snapshots, and Evening Forecast Validation.</div></div><a href="/apex_os/readiness">← Readiness</a></div><div class="card"><div id="rows" class="rows">Loading archive…</div></div><div class="card"><h2 id="viewerTitle">Select a report</h2><div id="viewer" class="viewer muted">Historical reports open here without regenerating them.</div></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function openReport(kind,date){let url=kind==='readiness'?'/api/readiness/archive/'+date:kind==='brief'?'/api/morning-brief/archive/'+date:'/api/evening-recap?date='+date;const r=await fetch(url,{cache:'no-store'}),j=await r.json();viewerTitle.textContent=date+' · '+({readiness:'Morning Readiness',brief:'Morning Brief',recap:'Evening Recap & Forecast Validation'}[kind]);if(!r.ok||j.ok===false){viewer.textContent=j.error||j.status||'Report unavailable';return}if(kind==='readiness'){viewer.innerHTML='<pre>'+esc(JSON.stringify(j,null,2))+'</pre>';return}viewer.innerHTML=window.marked?marked.parse(j.markdown||'No Markdown report stored.'):'<pre>'+esc(j.markdown||JSON.stringify(j,null,2))+'</pre>'}
async function load(){const r=await fetch('/api/report-archive?limit=90',{cache:'no-store'}),j=await r.json();if(!j.ok){rows.textContent='Archive unavailable';return}if(!j.items.length){rows.innerHTML='<div class="muted">No archived reports yet. New reports will appear automatically.</div>';return}rows.innerHTML=j.items.map(x=>`<div class="row"><div class="date">${esc(x.session_date)}</div><div class="chips">${x.morning_readiness?'<span class="chip">Readiness</span>':''}${x.morning_brief?'<span class="chip">Morning Brief</span>':''}${x.evening_recap?'<span class="chip">Evening Validation '+esc(x.grade||'')+(x.score!=null?' · '+esc(x.score)+'%':'')+'</span>':''}</div><div class="actions">${x.morning_readiness?`<button onclick="openReport('readiness','${esc(x.session_date)}')">Readiness</button>`:''}${x.morning_brief?`<button onclick="openReport('brief','${esc(x.session_date)}')">Brief</button>`:''}${x.evening_recap?`<button onclick="openReport('recap','${esc(x.session_date)}')">Recap</button>`:''}</div></div>`).join('')}
load();
</script></body></html>
